version: '3.8'

services:
  trading-bot:
    build: .
    container_name: trading-bot
    restart: unless-stopped
    ports:
      - "7860:7860"
    volumes:
      - bot-data:/app/data
      - ./binance_config.env:/app/binance_config.env:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  bot-data:
